<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบใส่ลายน้ำ FAH</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        canvas { max-width: 100%; height: auto; margin-top: 15px; border: 1px solid #ddd; border-radius: 5px; }
        input, button { margin: 10px 0; padding: 10px; font-size: 16px; }
        button { background: #ff4757; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #ff6b81; }
    </style>
</head>
<body>

    <div class="box">
        <h2>เว็บไซต์ใส่ลายน้ำ FAH</h2>
        <input type="file" id="upload" accept="image/*"><br>
        <button id="downloadBtn" style="display:none;">ดาวน์โหลดรูปภาพ</button><br>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        upload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // กำหนดขนาด Canvas เท่ารูปจริง
                    canvas.width = img.width;
                    canvas.height = img.height;

                    // 1. วาดรูปต้นฉบับลงไป
                    ctx.drawImage(img, 0, 0);

                    // 2. ตั้งค่าลายน้ำ
                    ctx.save();
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate(-15 * Math.PI / 180); // เอียง -15 องศา (แนวตวัดๆ)

                    let fontSize = canvas.width / 5;
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.fillStyle = "rgba(255, 255, 255, 0.4)"; // สีขาวโปร่งใส 40%
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    
                    // วาดคำว่า FAH ตรงกลาง
                    ctx.fillText("FAH", 0, 0);
                    ctx.restore();

                    // แสดงปุ่มดาวน์โหลด
                    downloadBtn.style.display = "inline-block";
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // ปุ่มสำหรับดาวน์โหลดรูปที่ใส่ลายน้ำแล้ว
        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'fah_watermark.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });
    </script>

</body>
</html>
